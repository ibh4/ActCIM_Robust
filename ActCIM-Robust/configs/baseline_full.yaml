extends: base
model: resnet18_cifar
training:
  epochs: 120
  label_smoothing: 0.0
  amp: true
optimizer:
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
scheduler:
  type: cosine
  warmup_epochs: 3
nonlinearity:
  enabled: false
reproducibility:
  deterministic: true
  benchmark: false
