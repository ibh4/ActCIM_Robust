project: ActCIM-Robust
dataset: cifar10
model: tinycnn
num_classes: 10
device: cuda

data:
  root: data
  batch_size: 64
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  train_subset: 2048
  val_subset: 512
  test_subset: 512

optimizer:
  type: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true

scheduler:
  type: cosine
  warmup_epochs: 1

training:
  epochs: 1
  label_smoothing: 0.0
  use_amp: false
  grad_clip: 0.0
  patience: 5
  metric_attr: val_acc

nonlinearity:
  enabled: false
  alpha: 0.0
  normalization_scope: per_tensor
  injection_mode: all_layers
  alpha_mode: fixed

reproducibility:
  deterministic: true
  benchmark: false
